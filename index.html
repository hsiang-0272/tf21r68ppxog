<style>
:root{--paper:#FAF7F1;--ink:#0F1B2B;--ink2:#5B6472;--gold:#B8935A;--gold-l:#E3CB98;--navy:#14243A;--err:#A23B2A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
.lock{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:360px;text-align:center}
.ic{width:88px;height:88px;border-radius:20px;display:block;margin:0 auto 18px;box-shadow:0 4px 14px rgba(15,27,43,.12)}
h1{font-size:24px;letter-spacing:.12em;margin:0 0 6px;color:var(--navy)}
.sub{font-size:14px;color:var(--ink2);margin:0 0 26px;line-height:1.6}
form{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px}
input[type=password],input[type=text]{flex:1;min-width:0;font-size:18px;padding:12px 14px;border:1px solid var(--gold-l);border-radius:10px;background:#fff;color:var(--ink);letter-spacing:.08em}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.eye{flex:none;font-size:14px;padding:0 14px;border:1px solid var(--gold-l);border-radius:10px;background:#fff;color:var(--ink2)}
.rem{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--ink2)}
.rem input{width:18px;height:18px;accent-color:var(--navy)}
.go{font-size:17px;font-weight:700;padding:13px;border:0;border-radius:10px;background:var(--navy);color:#fff;letter-spacing:.2em}
.go:disabled{opacity:.6}
.msg{min-height:22px;font-size:14px;color:var(--err)}
.foot{font-size:12px;color:var(--ink2);margin-top:22px;line-height:1.6}
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <div class="card">
    <img class="ic" src="icons/icon-192.png" alt="">
    <h1>諏訪御神渡</h1>
    <p class="sub">私人行程，請輸入密碼</p>
    <form id="f" autocomplete="on">
      <input type="text" name="username" value="諏訪御神渡" autocomplete="username" hidden>
      <div class="row">
        <input id="pw" type="password" autocomplete="current-password" placeholder="密碼" required>
        <button class="eye" type="button" id="eye">顯示</button>
      </div>
      <label class="rem"><input type="checkbox" id="rem" checked>記住這支手機（下次不用再輸入）</label>
      <button class="go" id="go" type="submit">打開</button>
      <div class="msg" id="msg"></div>
    </form>
    <p class="foot">內容已加密，密碼只在這支手機上解開，不會傳到網路。</p>
  </div>
</div>

const lock=document.getElementById("lock"),f=document.getElementById("f"),pw=document.getElementById("pw"),
      go=document.getElementById("go"),msg=document.getElementById("msg");
document.getElementById("eye").onclick=e=>{const v=pw.type==="password";pw.type=v?"text":"password";e.target.textContent=v?"隱藏":"顯示";};
f.onsubmit=async e=>{
  e.preventDefault();msg.textContent="";go.disabled=true;go.textContent="解鎖中…";
  try{
    const raw=await derive(pw.value),h=await decrypt(raw);
    if(document.getElementById("rem").checked) ls(()=>localStorage.setItem(K,enc(raw)));
    show(h);
  }catch(err){
    go.disabled=false;go.textContent="打開";
    msg.textContent=window.crypto&&crypto.subtle?"密碼不對，請再試一次":"這個瀏覽器不支援解密，請用 Safari 或 Chrome 開啟";
    pw.select();
  }
};
(async()=>{
  const saved=ls(()=>localStorage.getItem(K));
  if(saved){try{show(await decrypt(b64(saved)));return;}catch(e){ls(()=>localStorage.removeItem(K));}}
  lock.hidden=false;pw.focus();
})();
})();
</script>
</body>
</html>
